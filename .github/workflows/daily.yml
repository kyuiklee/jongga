name: 종가매매 검색

on:
  schedule:
    # 시간은 UTC 기준 (KST = UTC+9). GitHub 예약 실행은 수 분~수십 분 늦게 시작될 수 있습니다.
    - cron: "12 6 * * 1-5"   # 15:12 KST — 장마감 전 예비 결과
    - cron: "33 6 * * 1-5"   # 15:33 KST — 확정 결과
    - cron: "5 7 * * 1-5"    # 16:05 KST — 확정 결과 재확인 (앞 실행이 늦거나 실패했을 때 대비)
  workflow_dispatch: {}      # GitHub 앱/웹에서 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - run: pip install -r engine/requirements.txt

      - name: 이전 일봉 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: hist-${{ github.run_id }}
          restore-keys: hist-

      - name: 검색 실행
        run: python engine/build.py

      - name: 백테스트 검증 자료
        run: python engine/check.py || true

      - name: 일봉 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: hist-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
